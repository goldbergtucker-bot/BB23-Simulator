<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Brother 23 — Custom Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="brand">
        <h1>BIG BROTHER 23</h1>
        <p>Custom BrantSteele-Style Simulator</p>
    </div>

    <nav class="main-nav">
        <button type="button" onclick="showPage('setup-page')">SETUP</button>
        <button type="button" onclick="showPage('simulator-page')">SIMULATOR</button>
        <button type="button" onclick="showPage('results-page')">RESULTS</button>
    </nav>
</header>

<main>

<section id="setup-page" class="page active-page">

    <div class="page-header">
        <h2>Season Setup</h2>
        <p>Create your custom Big Brother season.</p>
    </div>

    <div class="setup-grid">

        <section class="panel">
            <h3>Season Information</h3>

            <label>
                Season Name
                <input id="season-name" type="text" value="Big Brother 23">
            </label>

            <label>
                Season Year
                <input id="season-year" type="number" value="2021">
            </label>

            <label>
                Season Theme
                <input id="season-theme" type="text" value="Hotel BB">
            </label>

            <label>
                Theme / Logo Image URL
                <input id="season-logo" type="text" placeholder="https://...">
            </label>

            <label>
                Background Image URL
                <input id="season-background" type="text" placeholder="https://...">
            </label>

            <label>
                Number of Houseguests
                <input id="houseguest-count" type="number" min="2" max="100" value="16">
            </label>

            <label>
                Season Length
                <input id="season-weeks" type="number" min="1" max="30" value="13">
            </label>

            <button
                type="button"
                class="primary-button"
                onclick="createNewSeason()">
                CREATE SEASON
            </button>
        </section>


        <section class="panel">
            <h3>Houseguests</h3>

            <div id="houseguest-editor"></div>

            <button
                type="button"
                class="secondary-button"
                onclick="addHouseguest()">
                + ADD HOUSEGUEST
            </button>
        </section>

    </div>


    <section class="panel advanced-panel">
        <h3>Twists & Powers</h3>

        <div id="twist-editor"></div>

        <div class="advanced-card-actions">
            <button
                id="save-twist-btn"
                type="button"
                class="secondary-button">
                SAVE TWIST
            </button>

            <button
                id="cancel-twist-btn"
                type="button"
                class="secondary-button">
                CANCEL
            </button>
        </div>

        <div id="twist-list"></div>
    </section>


    <section class="panel">
        <h3>Saved Seasons</h3>

        <div id="saved-seasons-list"></div>

        <div class="button-row">
            <button
                type="button"
                class="secondary-button"
                onclick="saveCurrentSeason()">
                SAVE SEASON
            </button>

            <button
                type="button"
                class="secondary-button"
                onclick="openSavedSeason()">
                OPEN SEASON
            </button>
        </div>
    </section>

</section>


<section id="simulator-page" class="page">

    <div class="page-header">
        <h2 id="simulator-title">Simulation</h2>

        <div class="simulator-controls">
            <button
                type="button"
                class="secondary-button"
                onclick="returnToSetup()">
                BACK TO SETUP
            </button>

            <button
                type="button"
                class="primary-button"
                onclick="runNextEvent()">
                NEXT EVENT
            </button>
        </div>
    </div>


    <div id="simulator-status" class="status-grid"></div>


    <div class="simulation-layout">

        <aside class="simulation-sidebar">

            <section class="panel">
                <h3>Weeks</h3>
                <div id="simulation-week-navigation"></div>
            </section>

            <section class="panel">
                <h3>Memory Wall</h3>
                <div id="memory-wall-mini"></div>
            </section>

        </aside>


        <section class="simulation-main">

            <div id="game-chain" class="game-chain"></div>

            <div id="event-display" class="event-display">
                <div class="empty-state">
                    Press <strong>NEXT EVENT</strong> to begin.
                </div>
            </div>

        </section>

    </div>

</section>


<section id="results-page" class="page">

    <div class="page-header results-header">
        <div>
            <h2>Season Results</h2>
            <p id="results-season-name"></p>
        </div>
    </div>

    <div id="results-content"></div>

</section>

</main>


<footer class="site-footer">
    <p>Big Brother 23 Custom Simulator</p>
</footer>


<script src="data/bb23-config.js"></script>
<script src="engine/competitions.js"></script>
<script src="engine/game-state.js"></script>
<script src="engine/relationships.js"></script>
<script src="engine/season-engine.js"></script>
<script src="app.js"></script>

</body>
</html>
